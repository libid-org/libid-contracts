[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
# Tests live beside the code they cover — contracts/login/test, contracts/
# transfer/test, contracts/identity/test — so discovery goes through src
# rather than one test directory.
test = "contracts"
solc = "0.8.33"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
    # Local proof artifacts, if someone drops them in; the OIDC flow tests
    # self-skip when these files are absent.
    { access = "read", path = "circuits/jwt_email/target" },
    { access = "read", path = "contracts/login/test/fixtures/oidc" },
    # The naming system keeps its own copy: the rotation proof binds no
    # contract, so the same notarized reading feeds both trust lists, but the
    # identity tree must not read out of the login tree.
    { access = "read", path = "contracts/identity/test/fixtures/oidc" },
    # TS/Solidity parity fixture for bind-request encoding (vendored from the
    # browser identity package; see BindEncoding.t.sol).
    { access = "read", path = "contracts/identity/test/fixtures" },
    { access = "read", path = "out" }, # diamond deployer reads facet methodIdentifiers
]
