[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
# Tests live beside the code they cover — contracts/ceremony/test, contracts/
# identity/test, contracts/factory/test — so discovery goes through src
# rather than one test directory.
test = "contracts"
solc = "0.8.33"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# No CBOR metadata / ipfs hash in bytecode: via_ir compiles the tree as one
# unit, so the metadata hash of every contract changes when any source does —
# which would make the vendored artifacts under rust/contracts/artifacts churn
# on unrelated edits. Explorer verification still works via standard-json.
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
    # Google's real JWKS body, as served today, so the root list's parser is
    # tested against the document it will actually read rather than a shape
    # a test author remembered (see GoogleJwtRoots.t.sol) -- and a whole
    # notarized session of it, signature included, so the real path is tested
    # end to end (see GoogleJwtRootsRealSession.t.sol).
    { access = "read", path = "contracts/ceremony/test/fixtures" },
    { access = "read", path = "out" }, # the factory tests read creation code from the artifacts
]

# Lint findings fail CI: the Solidity job runs `forge lint -D notes`, the
# counterpart of `cargo clippy -D warnings` and `pnpm lint` in the jobs beside
# it. A plain `forge build` runs the same linter (lint_on_build, the default)
# but only prints; run the CI command locally to see the failure first. Two
# things about that command are not obvious:
#
#   - `forge lint` compiles before it lints, and `-D` covers the compiler too:
#     on a cold cache a solc warning fails the command the way a note does.
#     The tree compiles without one, libraries included -- which is why
#     forge-std is at v1.14 or later. Before that, its `memory-safe-assembly`
#     comments drew 698 deprecation warnings from solc 0.8.33, past solc's
#     cap of 256, and the "more than 256 warnings" marker is itself a warning
#     with no file, so nothing ignores it.
#   - The lint ids below are the pinned Foundry's (FOUNDRY_VERSION in ci.yml).
#     An older forge refuses the ones it has never heard of -- "Unknown lint
#     ID" -- so match the pin locally: `foundryup -i <version>`.
#
# Every lint switched off below says why. A single site that is right as
# written carries a `// forge-lint: disable-...` comment with its reason
# instead, so the lint stays on for the next one.
[lint]
# Foundry's default stops at `low`, which leaves the style lints off: naming,
# named struct fields, unused and unaliased imports. They are on. `gas` and
# `code-size` stay off because their advice -- assembly keccak, a custom error
# for every require string, modifier bodies moved into functions -- is a
# rewrite, not a check.
severity = ["high", "med", "low", "info"]
exclude_lints = [
    # Fires on every comparison that reads block.timestamp. Each one here
    # decides a validity window -- a token's or a signature's expiry, the
    # freshness of a notarized reading, the grace for a clock that runs ahead
    # -- measured in minutes at the least. A validator's latitude over the
    # timestamp is seconds: it moves the edge of such a window, and nothing
    # here rides on the edge.
    "block-timestamp",
    # A test's stubs and adversaries -- a Honk verifier that says yes, a
    # receiver that reenters `claim` -- live in the file with the test that
    # reads them. The two production files with an interface beside their
    # contract declare what that contract asks of a collaborator
    # (IGoogleJwtRoots, IHonkVerifier), not the collaborator itself.
    "multi-contract-file",
    # The cheatcodes it names are file access, `ffi`, `setEnv` and `deriveKey`.
    # File access is what fs_permissions above confines already -- read-only,
    # two directories -- and `ffi` is off. The uses on the tree are tests
    # reading those two directories.
    "unsafe-cheatcode",
]
