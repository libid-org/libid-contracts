name: CI

# Five jobs, one shared expensive step. `forge build` is the input to almost
# everything — the Solidity tests run over it, the vendored Rust artifacts are
# generated from it, and the TypeScript codegen reads it — so the jobs that
# need it run the same .github/actions/forge-build composite with the same
# cache key, and whichever run warms the cache first makes the build a fast
# no-op everywhere else.
#
# Neither generated tree is committed (rust/contracts/artifacts and
# ts/packages/contracts/src/abis are gitignored), so every job that compiles
# the crate or the package regenerates it first — publishing included.
#
# Job ids are stable on purpose (solidity, handles-drift, rust, ts, dco):
# the release/publish jobs at the bottom of this file hang their `needs:` off
# these names.
#
# Releases: publishing a GitHub Release tagged `v<version>` runs this same
# workflow with the release event. versions and publish-check run on every
# event; verify-tag, publish-crates and publish-npm are release-only. One
# version, one tag, two registries — see the "Releasing" section of the
# README.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment,
# so a moved tag cannot change what executes.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  # Superseded pushes stop burning minutes immediately.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Every cargo invocation, not just clippy, treats warnings as errors.
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  # Incremental state is written, cached and never read in CI — every job
  # starts from a restored cache and never rebuilds the same crate twice.
  CARGO_INCREMENTAL: 0
  # Foundry stable release, current at the time of pinning. Part of the forge
  # cache key, so bumping it starts a fresh artifact cache.
  FOUNDRY_VERSION: v1.7.1
  # Rust stable, pinned so a toolchain release cannot break CI mid-PR.
  RUST_VERSION: 1.97.1
  # Nightly is for `cargo +nightly fmt` ONLY: rustfmt options like
  # `imports_granularity` are nightly-only, and stable rustfmt does not reject
  # them — it silently IGNORES them and reports success. Dated pin so a
  # nightly formatting change cannot turn the tree red overnight.
  NIGHTLY: nightly-2026-08-10

jobs:
  # ---------------------------------------------------------------------------
  # Solidity: build, tests, formatting.
  # ---------------------------------------------------------------------------
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - name: Test
        working-directory: solidity
        run: forge test -vvv

      - name: Formatting
        working-directory: solidity
        run: forge fmt --check

  # ---------------------------------------------------------------------------
  # Generated files match their source. handles.json generates the platform
  # constants and the handle vector table for every language; a drift between
  # the source and a committed output leaves every per-language test green
  # while the languages disagree with each other.
  # ---------------------------------------------------------------------------
  handles-drift:
    name: Generated handle tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodules: the script formats its Solidity output through
      # `forge fmt --raw -` (stdin), which reads foundry.toml but compiles
      # nothing, so the libraries are never consulted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not the forge-build composite: this job needs the `forge` binary for
      # fmt, not the artifacts, and skipping the build keeps the check at the
      # seconds it should cost.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Generated files are current
        run: python3 scripts/regen-identity-handles.py --check

  # ---------------------------------------------------------------------------
  # Verifiers: the committed bb-generated Solidity verifiers reproduce from
  # the pinned libid-circuits release. This replaces the reproducibility gate
  # that died with the monorepo split — there, the deploy workflow
  # recompiled the circuit next to the contracts; here, the circuits live in
  # libid-circuits and this job re-derives both verifiers from that repo's
  # released verification keys (verifier ⟵ vk alone, no nargo needed) and
  # byte-compares against the committed sources. A mismatch means the
  # deployed verifier no longer corresponds to the circuit the release
  # ships — the web prover and the on-chain verifier must roll together.
  #
  # solidity/circuits-version pins the release tag. Until that release is
  # actually cut on libid-org/libid-circuits, the download step fails with an
  # explicit message — that is intended, not flaky.
  #
  # The download/verify/regenerate/compare chain is scripts/regen-verifiers.sh
  # (--check here); the "Regenerate verifiers" dispatch workflow runs the same
  # script with --write to refresh the committed files after a pin bump.
  #
  # publish-crates hangs its `needs:` off this job so nothing publishes over a
  # drifted verifier; publish-npm inherits the gate through publish-crates.
  # ---------------------------------------------------------------------------
  verifiers:
    name: Verifiers match circuits release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keyed on the pin file, not the manifest's bb version — the manifest is
      # only known after the download, which now happens inside the script. A
      # pin bump starts a fresh cache; the script reuses a cached bb when its
      # version matches the new manifest and installs via bbup otherwise.
      - name: Cache barretenberg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bb
          key: bb-${{ runner.os }}-circuits-${{ hashFiles('solidity/circuits-version') }}

      # Same forge as everywhere else in this workflow, binary only — fmt
      # reads foundry.toml but compiles nothing.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The whole chain — download the pinned release, verify sha256s, install
      # bb at the manifest's version, regenerate with post-processing,
      # byte-compare — lives in the script, shared with the "Regenerate
      # verifiers" dispatch workflow so the check and the writer cannot drift.
      - name: Regenerate verifiers and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/regen-verifiers.sh --check

  # ---------------------------------------------------------------------------
  # Rust: vendored artifacts, formatting, clippy, tests. Needs forge twice
  # over — the vendored artifacts are generated from a fresh `forge build`,
  # and the integration tests spawn `anvil` (installed with the toolchain).
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      # Nightly first, stable second: this action makes the LAST toolchain it
      # installs the default, and everything except `cargo +nightly fmt` must
      # run on the pinned stable.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # Before any cargo step: `include_dir!` embeds this directory at compile
      # time, so without it every cargo command fails at macro expansion with
      # a message about a missing path rather than anything to do with Rust.
      - name: Vendor artifacts
        run: ./scripts/vendor-artifacts.sh

      - name: Formatting (nightly rustfmt)
        working-directory: rust
        # +"$NIGHTLY", not +nightly: the bare channel name makes rustup fetch
        # the LATEST nightly (without the rustfmt component) instead of the
        # pinned one installed above.
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: rust
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # TypeScript: codegen drift, build, tests, lint, formatting. The codegen
  # reads the forge artifacts, so the contracts build first.
  # ---------------------------------------------------------------------------
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      # pnpm before setup-node: `cache: pnpm` shells out to pnpm to locate the
      # store, so the binary has to exist first.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      # tsc compiles src/abis into dist, so this has to precede the build.
      - name: Generate ABIs
        run: pnpm -C ts codegen

      - name: Build
        run: pnpm -C ts build

      - name: Tests
        run: pnpm -C ts test

      - name: Lint and formatting
        run: pnpm -C ts lint && pnpm -C ts fmt:check

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer, as CONTRIBUTING.md
  # promises. Plain git over the event's commit range — no marketplace action,
  # so there is nothing to pin and nothing to compromise.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A release event carries no commit range — every commit it points at was
    # already DCO-checked on its PR — and the range plumbing below would only
    # fail on the empty variables.
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` are reachable
          # only in a complete clone, and the repo is small.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on a branch creation and may
            # be unreachable after a force push; in either case there is no
            # honest range, so fall back to the head commit alone rather than
            # failing on plumbing.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            git log -1 --format='  %h %s (%an)' "$sha"
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md: every commit must certify the DCO."
            exit 1
          fi
          echo "All commits in $range are signed off."

  # ---------------------------------------------------------------------------
  # One version, everywhere. The crate and the npm package release together
  # under a single number, and this check fails the PR the moment the two
  # manifests disagree — release day is too late to find out.
  # ---------------------------------------------------------------------------
  versions:
    name: Version fields agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crate and npm versions are equal
        run: ./.github/workflows/scripts/verify-tag.sh

  # ---------------------------------------------------------------------------
  # Publishability, checked on every PR: both registries' dry-runs pass over a
  # freshly generated tree, reproducing the release sequence exactly — forge
  # build, vendor the artifacts, generate the ABIs, then pack.
  #
  # `cargo publish --dry-run` is deliberately NOT given --no-verify: it packs
  # the crate and rebuilds it from its own tarball, which is what proves the
  # vendored artifacts were actually included. That is the guard that replaces
  # the drift check the committed copies used to allow.
  # ---------------------------------------------------------------------------
  publish-check:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Vendor artifacts
        run: ./scripts/vendor-artifacts.sh

      # Packs the crate and rebuilds it from the packaged tarball, proving the
      # published form compiles without the rest of the repo.
      #
      # --allow-dirty is required, not incidental: cargo refuses to package a
      # file that is not tracked in git, and artifacts/ is generated by the
      # step above. `include` in Cargo.toml is what pulls it into the tarball;
      # the verify build is what proves it arrived.
      - name: cargo publish --dry-run
        working-directory: rust
        run: |
          cargo publish --dry-run -p libid-identity
          cargo publish --dry-run --allow-dirty -p libid-contracts

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      - name: Generate ABIs
        run: pnpm -C ts codegen

      - name: Build
        run: pnpm -C ts build

      # From the package directory, not `pnpm -C`: pnpm 10 mangles the flags
      # it forwards to `npm publish` when -C is in play (observed: EUSAGE).
      #
      # "cannot publish over" is a pass: it means the manifest's version is
      # already live on npm — true on main right after every release until the
      # next bump — and packaging itself was validated before the registry
      # rejected the version. Real packaging failures exit through the else.
      - name: pnpm publish --dry-run
        working-directory: ts/packages/contracts
        run: |
          set -euo pipefail
          out=$(pnpm publish --dry-run --no-git-checks 2>&1) && status=0 || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ] && printf '%s' "$out" | grep -q 'cannot publish over'; then
            echo "::notice::version already on npm; dry-run packaging succeeded up to the registry version check"
            exit 0
          fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Release-only jobs from here down. A release is cut by publishing a GitHub
  # Release tagged v<version>; nothing publishes from pushes or PRs.
  # ---------------------------------------------------------------------------

  # The tag names the version the manifests already carry — the tag is a
  # pointer, never a source. Everything that publishes needs this first.
  verify-tag:
    name: Release tag matches versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag equals crate and npm versions
        run: ./.github/workflows/scripts/verify-tag.sh "${{ github.event.release.tag_name }}"

  # crates.io first: the crate has no dependency on the npm package, and
  # publishing the harder-to-yank registry first means a failure here leaves
  # nothing half-released.
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [verify-tag, versions, solidity, rust, publish-check, verifiers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # Idempotent-ish: a re-run after a partially failed release (say npm
      # setup was missing) must not hard-fail on the half that already landed.
      # The sparse index is the cheap ground truth; 404 means never published.
      - name: Skip crates this version already reached
        id: crates-check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for crate in libid-identity libid-contracts; do
            published="$(curl -fsSL "https://index.crates.io/li/bi/$crate" | jq -r .vers || true)"
            if grep -qxF "$version" <<<"$published"; then
              echo "::notice::$crate $version is already on crates.io; skipping its publish."
              echo "publish-${crate#libid-}=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish-${crate#libid-}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: cargo publish libid-identity
        if: steps.crates-check.outputs.publish-identity == 'true'
        working-directory: rust
        run: cargo publish -p libid-identity --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # libid-contracts only: libid-identity is pure Rust and embeds nothing.
      - name: Vendor artifacts
        run: ./scripts/vendor-artifacts.sh

      - name: cargo publish libid-contracts
        if: steps.crates-check.outputs.publish-contracts == 'true'
        working-directory: rust
        run: cargo publish --allow-dirty -p libid-contracts --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  # npm via OIDC trusted publishing: no long-lived token, the registry trusts
  # this repo + workflow + environment combination directly, and npm attaches
  # provenance. The npm-deploy environment is also the place to hang a manual
  # approval gate if one is ever wanted.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [verify-tag, ts, publish-crates]
    environment: npm-deploy
    permissions:
      id-token: write
      contents: read
    env:
      # The repo is public, so provenance attestation is on. (If the repo ever
      # goes private, flip this to false — provenance requires a public repo.)
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build contracts
        uses: ./.github/actions/forge-build
        with:
          foundry-version: ${{ env.FOUNDRY_VERSION }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      # OIDC trusted publishing needs npm >= 11.5; the npm bundled with the
      # pinned Node may lag behind.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      - name: Generate ABIs
        run: pnpm -C ts codegen

      - name: Build
        run: pnpm -C ts build

      # A prerelease must not become `latest`: 1.2.0-rc.1 publishes under the
      # dist-tag `rc`, a plain release under `latest`. The first prerelease
      # identifier is the tag, and it must be a legal dist-tag (npm rejects
      # anything that parses as a version, e.g. from 1.2.3-1).
      - name: Derive dist-tag from version
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%+*}"
          if [ "$base" != "${base#*-}" ]; then
            pre="${base#*-}"
            dist_tag="${pre%%.*}"
            if ! printf '%s' "$dist_tag" | grep -qE '^[A-Za-z][A-Za-z0-9._-]*$'; then
              echo "::error::prerelease identifier '$dist_tag' (from $version) is not a usable npm dist-tag; use a form like 1.2.0-rc.1" >&2
              exit 1
            fi
          else
            dist_tag=latest
          fi
          echo "Publishing with dist-tag: $dist_tag"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # From the package directory, not `pnpm -C` — same pnpm 10 flag-mangling
      # noted in publish-check.
      #
      # Auth is token-first with OIDC fallback. When the org-level NPM_TOKEN
      # secret is set (a granular token scoped to @libid with create-package
      # rights), it authenticates the publish — that is what lets a brand-new
      # package publish before any trusted publisher exists for it. When the
      # secret is absent, npm falls back to OIDC trusted publishing, which
      # needs the per-package trusted publisher (org libid-org, this repo,
      # workflow ci.yml, environment npm-deploy). Provenance attests on both
      # paths — it signs with the runner's OIDC identity regardless of how
      # the registry authenticated the publish.
      - name: pnpm publish
        working-directory: ts/packages/contracts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "Authenticating with the org npm token"
          else
            echo "No NPM_TOKEN secret; relying on OIDC trusted publishing"
          fi
          pnpm publish --access public --no-git-checks --tag "${{ steps.dist-tag.outputs.dist-tag }}"
